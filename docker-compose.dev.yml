services:
  nginx:
    ports:
      - "3000:80"

  node-app:
    build:
      context: .
      args:
        - NODE_ENV=development
    volumes:
      - "./:/app"
      - "/app/node_modules"
    environment:
      - NODE_ENV=development
      - MONGO_USER=kephas
      - MONGO_PASSWORD=test
      - SESSION_SECRET="myfleshwillfleeforeternity"
    scale: 1
    command: npm run dev


  mongo:
    environment:
      - MONGO_INITDB_ROOT_USERNAME=kephas
      - MONGO_INITDB_ROOT_PASSWORD=test



