services:

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro


  node-app:
    build: .
    environment:
      - PORT=3000
    depends_on:
      - mongo


  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-db:/data/db


  redis:
    image: redis:alpine
    ports:
      - "6379:6379"


volumes:
  mongo-db:
